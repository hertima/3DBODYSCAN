<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>iOS Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1d1d1f;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
  }

  .sim {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transform-origin: center center;
  }

  /* ── Title bar ── */
  .title-bar {
    display: flex;
    align-items: center;
    background: rgba(58,58,60,0.95);
    border-radius: 10px;
    padding: 0 14px;
    height: 36px;
    gap: 10px;
    width: 100%;
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
  .title-text {
    flex: 1; text-align: center;
    color: rgba(255,255,255,0.45);
    font-size: 12px; font-weight: 400; letter-spacing: -0.1px;
  }
  .spacer { width: 46px; }

  /* ── Wrapper dos botões laterais ── */
  /* 393px (tela) + 11px padding × 2 = 415px total */
  .phone-wrap {
    position: relative;
    width: 415px;
  }

  /* Buttons — posicionados relativo ao phone-wrap */
  .btn-power {
    position: absolute; right: -4px; top: 181px;
    width: 4px; height: 88px;
    background: linear-gradient(to right, #303034, #505056, #303034);
    border-radius: 0 3px 3px 0;
    box-shadow: 2px 1px 4px rgba(0,0,0,0.6);
    z-index: 10;
  }
  .btn-vol-up {
    position: absolute; left: -4px; top: 141px;
    width: 4px; height: 62px;
    background: linear-gradient(to left, #303034, #505056, #303034);
    border-radius: 3px 0 0 3px;
    box-shadow: -2px 1px 4px rgba(0,0,0,0.6);
    z-index: 10;
  }
  .btn-vol-down {
    position: absolute; left: -4px; top: 219px;
    width: 4px; height: 62px;
    background: linear-gradient(to left, #303034, #505056, #303034);
    border-radius: 3px 0 0 3px;
    box-shadow: -2px 1px 4px rgba(0,0,0,0.6);
    z-index: 10;
  }
  .btn-mute {
    position: absolute; left: -4px; top: 97px;
    width: 4px; height: 36px;
    background: linear-gradient(to left, #303034, #505056, #303034);
    border-radius: 3px 0 0 3px;
    box-shadow: -2px 1px 4px rgba(0,0,0,0.6);
    z-index: 10;
  }

  /* ── Phone frame ── */
  .phone {
    width: 100%;
    border-radius: 56px;
    padding: 11px;
    overflow: hidden;
    clip-path: inset(0 round 56px);
    background: linear-gradient(
      145deg,
      #5a5a5e 0%,
      #3a3a3e 10%,
      #242426 35%,
      #1e1e20 55%,
      #2a2a2e 75%,
      #424246 90%,
      #525256 100%
    );
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(255,255,255,0.06),
      inset 1px 0 0 rgba(255,255,255,0.08),
      inset -1px 0 0 rgba(255,255,255,0.08),
      0 50px 120px rgba(0,0,0,0.95),
      0 20px 50px rgba(0,0,0,0.7),
      0 6px 16px rgba(0,0,0,0.5);
  }

  /* Screen */
  .screen {
    width: 100%;
    height: 830px;
    background: transparent;
    border-radius: 45px;
    overflow: hidden;
    position: relative;
  }

  /* Dynamic Island */
  .island {
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    width: 114px; height: 28px;
    background: #000; border-radius: 15px;
    z-index: 12;
  }

  /* Status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0;
    height: 44px;
    background: #fff;
    color: #000;
    display: flex; align-items: center;
    padding: 0 24px;
    justify-content: space-between;
    z-index: 11; pointer-events: none;
    transition: background 0.3s, color 0.3s;
  }
  .clock { font-size: 15px; font-weight: 600; color: currentColor; letter-spacing: -0.2px; }
  .icons { display: flex; align-items: center; gap: 6px; }

  /* iframe */
  iframe {
    position: absolute;
    top: 42px; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: calc(100% - 42px);
    border: none;
  }
</style>
</head>
<body>
<div class="sim" id="sim">

  <!-- Title bar -->
  <div class="title-bar">
    <div class="dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <span class="title-text">iPhone 17 Pro &nbsp;·&nbsp; iOS 26</span>
    <div class="spacer"></div>
  </div>

  <!-- Wrapper: botões ficam aqui fora do overflow:hidden -->
  <div class="phone-wrap">
    <div class="btn-mute"></div>
    <div class="btn-vol-up"></div>
    <div class="btn-vol-down"></div>
    <div class="btn-power"></div>

    <!-- Phone: overflow:hidden clippa os cantos corretamente -->
    <div class="phone">
      <div class="screen">
        <div class="island"></div>

        <div class="status">
          <span class="clock" id="clock"></span>
          <div class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
              <rect x="0"  y="8" width="3" height="4" rx="0.5"/>
              <rect x="4"  y="5.5" width="3" height="6.5" rx="0.5"/>
              <rect x="8"  y="3" width="3" height="9" rx="0.5"/>
              <rect x="12" y="0" width="3" height="12" rx="0.5"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M8 10.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/>
              <path d="M5 7.8C5.8 7 6.8 6.5 8 6.5s2.2.5 3 1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M2.5 5.2C4 3.7 5.9 2.8 8 2.8s4 .9 5.5 2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
              <rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.5"/>
              <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/>
              <path d="M23.5 4v4a2 2 0 000-4z" fill="currentColor" fill-opacity="0.4"/>
            </svg>
          </div>
        </div>

        <iframe id="app" src="/"></iframe>
      </div>
    </div>
  </div>

</div>

<script>
  function tick() {
    const n = new Date();
    document.getElementById('clock').textContent =
      n.getHours().toString().padStart(2,'0') + ':' +
      n.getMinutes().toString().padStart(2,'0');
  }
  tick(); setInterval(tick, 1000);

  function scale() {
    const totalH = 36 + 10 + 11 + 830 + 11;
    const s = Math.min(
      (innerHeight - 20) / totalH,
      (innerWidth  - 20) / 415,
      1
    );
    document.getElementById('sim').style.transform = `scale(${s})`;
  }
  scale(); addEventListener('resize', scale);

  const status = document.querySelector('.status');
  window.addEventListener('message', (e) => {
    if (e.data?.type !== 'mockup-theme') return;
    status.style.background = e.data.background;
    status.style.color = e.data.isDark ? '#fff' : '#000';
  });
</script>
</body>
</html>
